name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-n-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Build (check that app compiles)
        run: python -m compileall app

      - name: Unit tests
        run: python -m pytest tests -v

  docker-api:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image-name: sofiya56/lab4-api
      tag: latest
      push: ${{ github.ref == 'refs/heads/main' }}
      artifact-name: image-api
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-client:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image-name: sofiya56/lab4-client
      tag: latest
      context: ./client
      dockerfile: client/Dockerfile
      push: ${{ github.ref == 'refs/heads/main' }}
      artifact-name: image-client
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-migrator:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      image-name: sofiya56/lab4-migrator
      tag: latest
      context: .
      dockerfile: migrator/Dockerfile
      push: ${{ github.ref == 'refs/heads/main' }}
      artifact-name: image-migrator
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
