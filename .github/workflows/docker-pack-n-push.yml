name: docker-pack-n-push

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Назва репозиторію Docker Hub (user/repo)'
        required: true
        type: string
      tag:
        description: 'Тег образу'
        required: false
        type: string
        default: latest
      push:
        description: 'true - push у Docker Hub, false - зберегти як артефакт'
        required: false
        type: boolean
        default: false
      context:
        description: 'Build context'
        required: false
        type: string
        default: .
      dockerfile:
        description: 'Шлях до Dockerfile'
        required: false
        type: string
        default: ./Dockerfile
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  docker-pack-n-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- main: login + push у Docker Hub ----
      - name: Login to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.image-name }}:${{ inputs.tag }}

      # ---- інші гілки: збірка і збереження в артефакти ----
      - name: Build and export to tar
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          tags: ${{ inputs.image-name }}:${{ inputs.tag }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 7
