trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  dockerRegistryServiceConnection: 'DockerHubConnection'
  imageRepository: 'sofiya56/library-app'
  dockerfilePath: 'Dockerfile'

steps:
  # a. Збирання проєкту (встановлення залежностей)
  - task: UsePythonVersion@0
    displayName: 'Use Python 3.11'
    inputs:
      versionSpec: '3.11'

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Build project (install dependencies)'

  # b. Запуск unit-тестів
  - script: |
      pip install pytest
      python -m pytest tests --junitxml=test-results.xml
    displayName: 'Run unit tests'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: 'test-results.xml'
      testRunTitle: 'Unit tests'

  # c + d. Збирання Docker-образу та присвоєння тегів
  - task: Docker@2
    displayName: 'Build Docker image'
    inputs:
      command: build
      containerRegistry: $(dockerRegistryServiceConnection)
      repository: $(imageRepository)
      dockerfile: $(dockerfilePath)
      tags: |
        latest
        $(Build.BuildId)

  # e. Публікація в Docker Hub
  - task: Docker@2
    displayName: 'Push Docker image'
    inputs:
      command: push
      containerRegistry: $(dockerRegistryServiceConnection)
      repository: $(imageRepository)
      tags: |
        latest
        $(Build.BuildId)